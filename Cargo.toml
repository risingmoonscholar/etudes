# etudes: small studies in local-first software.
#
# One repo, several binaries, one shared core. Split into per-tool repos only
# when etude-core stops moving; today it is still learning what it needs from a
# second caller.

[workspace]
resolver = "3"
members = ["crates/etude-core", "crates/sweep-cli", "crates/etude-keep", "crates/etude-read", "crates/stash-cli", "crates/unpack-cli", "crates/fixtures", "crates/journal-dump"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/risingmoonscholar/etudes"

# Dependency policy in deny.toml, enforced by the `deny` job in
# .github/workflows/ci.yml on every push:
#   - nothing that can open a socket, resolve a name, or spawn a runtime
#   - no build.rs code execution in the tree
# The engine crate (etude-core) has no dependencies on external code. That is
# the cheapest possible audit for the classification path: there is nothing
# to audit. (It does carry one dev-dependency, `fixtures`, a workspace-internal
# crate used only by its own test suite. See
# crates/sweep-cli/tests/no_network.rs for what that test actually asserts.)
