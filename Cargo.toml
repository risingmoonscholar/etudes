[workspace]
resolver = "3"
members = ["crates/sweep-core", "crates/sweep-cli", "crates/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "local"

# Dependency policy, enforced mechanically by deny.toml:
#   - nothing that can open a socket, resolve a name, or spawn a runtime
#   - no build.rs code execution in the tree
# The engine crate (sweep-core) has NO dependencies at all in v0.1. That is the
# cheapest possible audit: there is nothing to audit.
