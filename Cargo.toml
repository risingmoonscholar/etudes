# etudes — small studies in local-first software.
#
# One repo, several binaries, one shared core. Split into per-tool repos only
# when etude-core stops moving; today it is still learning what it needs from a
# second caller.

[workspace]
resolver = "3"
members = ["crates/etude-core", "crates/sweep-cli", "crates/etude-keep", "crates/etude-read", "crates/stash-cli", "crates/unpack-cli", "crates/fixtures"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/risingmoonscholar/etudes"

# Dependency policy in deny.toml (reviewers run `cargo deny check bans` manually;
# CI does not currently run it):
#   - nothing that can open a socket, resolve a name, or spawn a runtime
#   - no build.rs code execution in the tree
# The engine crate (etude-core) has NO dependencies at all. That is the
# cheapest possible audit: there is nothing to audit.
