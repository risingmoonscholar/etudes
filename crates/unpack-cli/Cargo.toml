[package]
name = "unpack-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Extracts any common archive into its own directory, refusing member paths that escape it."
readme = "../../README.md"
keywords = ["cli", "archive", "zip", "tar", "extract"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "unpack"
path = "src/main.rs"

# No archive-parsing crates. The system tools are better tested than anything
# this would add, and the value here is the safe uniform wrapper, not a parser.
[dependencies]
etude-core = { path = "../etude-core", version = "0.5.0" }
