[package]
name = "stash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Moves everything in a folder into one hidden holding directory and brings it all back on demand."
readme = "../../README.md"
keywords = ["cli", "files", "cleanup", "undo", "macos"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "stash"
path = "src/main.rs"

[dependencies]
etude-core = { path = "../etude-core", version = "0.3.0" }
etude-keep = { path = "../etude-keep", version = "0.3.0" }

[dev-dependencies]
fixtures = { path = "../fixtures", version = "0.3.0" }
