[package]
name = "sweep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sweep"
path = "src/main.rs"

# Argument parsing is hand-rolled. A CLI parser is a large dependency surface for
# a tool whose selling point is a readable dependency tree, and sweep's grammar
# is four verbs.
[dependencies]
etude-core = { path = "../etude-core" }
etude-keep = { path = "../etude-keep" }
etude-read = { path = "../etude-read" }

[dev-dependencies]
fixtures = { path = "../fixtures" }
