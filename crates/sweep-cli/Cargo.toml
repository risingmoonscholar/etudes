[package]
name = "sweep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Groups a folder's obvious files by name signal, and refuses to move anything that looks like a personal record."
readme = "../../README.md"
keywords = ["cli", "files", "organise", "privacy", "macos"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "sweep"
path = "src/main.rs"

# Argument parsing is hand-rolled. A CLI parser is a large dependency surface for
# a tool whose selling point is a readable dependency tree, and sweep's grammar
# is four verbs.
[dependencies]
etude-core = { path = "../etude-core", version = "0.5.1" }
etude-keep = { path = "../etude-keep", version = "0.5.1" }
etude-read = { path = "../etude-read", version = "0.5.1" }

[dev-dependencies]
fixtures = { path = "../fixtures", version = "0.5.1" }
