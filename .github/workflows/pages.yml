name: pages

# Publishes demo/ to GitHub Pages only after a GitHub Release is published.
# The version manifest must match the newest public per-tool tags before the
# artifact can be uploaded. A demo-only edit cannot publish or advance the page.
#
# The demo lives next to the code that produces it on purpose: every terminal
# block on that page is captured by scripts/capture-demos.sh from binaries built
# out of this tree. Hosting it anywhere else would let the page drift from the
# tool without anything noticing.
#
# It uploads demo/ as an artifact rather than publishing from a branch, so the
# gitignored docs/ decision stays untouched and there is no gh-pages branch to
# keep in sync.

on:
  release:
    # `released` covers promoting a prerelease to stable; `published` covers
    # publishing a new stable release directly.
    types: [published, released]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages is not available on a private repo, so this would fail on every
    # push rather than tell anyone anything. Skipping is the honest state:
    # not published yet, not broken.
    if: >-
      github.event.repository.visibility == 'public' &&
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Refuse invalid Pages release events
        run: |
          if [ "$GITHUB_EVENT_NAME" != "release" ]; then
            echo "Pages may deploy only after a published release; event was $GITHUB_EVENT_NAME"
            exit 1
          fi
          if [ "$GITHUB_EVENT_ACTION" != "published" ] && [ "$GITHUB_EVENT_ACTION" != "released" ]; then
            echo "Unsupported Pages release action: $GITHUB_EVENT_ACTION"
            exit 1
          fi
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/(sweep|stash|unpack)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Pages release must be a per-tool version tag: $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Build exactly the tree attached to this tool release. A rerun of
          # an old release must never publish a newer main-tree demo.
          # GITHUB_SHA is the commit GitHub associated with this release event;
          # pinning it prevents a moved tag from changing a workflow rerun.
          ref: ${{ github.sha }}

      - name: Refuse unpublished or stale page versions
        run: python3 scripts/check-pages-release.py
        env:
          GH_TOKEN: ${{ github.token }}

      # The page reads transcripts.json at runtime. If it is missing, the page
      # renders a "not loaded" message. That is a broken demo published
      # quietly. Fail here instead.
      - name: Refuse to publish a demo with no transcripts
        run: |
          test -f demo/transcripts.json || { echo "demo/transcripts.json missing"; exit 1; }
          python3 -c "
          import json,sys
          d=json.load(open('demo/transcripts.json'))
          n=len(d.get('transcripts',[]))
          assert n > 0, 'transcripts.json has no transcripts'
          print(f'{n} transcripts, captured at {d.get(\"commit\",\"?\")}')
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deploy
        uses: actions/deploy-pages@v4
