name: pages

# Publishes demo/ to GitHub Pages.
#
# The demo lives next to the code that produces it on purpose: every terminal
# block on that page is captured by scripts/capture-demos.sh from binaries built
# out of this tree. Hosting it anywhere else would let the page drift from the
# tool without anything noticing.
#
# It uploads demo/ as an artifact rather than publishing from a branch, so the
# gitignored docs/ decision stays untouched and there is no gh-pages branch to
# keep in sync.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  # A published release is also a publication event: redeploy the page from
  # main only after all per-tool tags are visible to the release gate.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages is not available on a private repo, so this would fail on every
    # push rather than tell anyone anything. Skipping is the honest state:
    # not published yet, not broken.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Refuse to deploy from a non-main ref
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Pages may only deploy from main; selected ref was $GITHUB_REF"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Pages push deployment must come from main; selected ref was $GITHUB_REF"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$GITHUB_EVENT_NAME" != "release" ]; then
            echo "Unsupported Pages deployment event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # A release event's default ref is its tag. Pages always publishes
          # the current main-tree demos, then verifies them against remote tags.
          ref: main

      - name: Refuse unpublished or stale page versions
        run: python3 scripts/check-pages-release.py

      # The page reads transcripts.json at runtime. If it is missing, the page
      # renders a "not loaded" message. That is a broken demo published
      # quietly. Fail here instead.
      - name: Refuse to publish a demo with no transcripts
        run: |
          test -f demo/transcripts.json || { echo "demo/transcripts.json missing"; exit 1; }
          python3 -c "
          import json,sys
          d=json.load(open('demo/transcripts.json'))
          n=len(d.get('transcripts',[]))
          assert n > 0, 'transcripts.json has no transcripts'
          print(f'{n} transcripts, captured at {d.get(\"commit\",\"?\")}')
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deploy
        uses: actions/deploy-pages@v4
