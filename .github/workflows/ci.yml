name: ci

on:
  workflow_dispatch:
  schedule:
    # nightly; the stress suite takes minutes, so it does not run per-push
    - cron: '17 9 * * *'
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: second-platform check, non-blocking (ubuntu)
    runs-on: ubuntu-latest
    # Not a support claim. This project is macOS only. See the readme.
    #
    # It runs because a second machine is the cheapest way to find out what the
    # first one let you assume. In one afternoon it caught six things: a test
    # reading munmap'd memory, three tests that assumed a keychain exists, one
    # that asserted a property of the machine it was written on, and a real bug
    # in apply. Apply refused legal work on a case-sensitive filesystem. This
    # filesystem type exists on macOS too. The mac suite could not detect it
    # structurally.
    #
    # It fails loudly and it does not gate anything. Those are different
    # things and continue-on-error confuses them: it renders a failed job as a
    # green check with a warning nobody opens, which is the exact shape this
    # project argues against. So the job goes red when it goes red.
    #
    # Non-blocking is a branch-protection decision, not a workflow one. This is
    # deliberately NOT in the required-checks list, so a red here never stops a
    # merge. It just sits there being true.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all

  macos:
    name: fmt, clippy, test, no-network (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      # The suite again with sockets denied by the OS. sandbox-exec is macOS
      # only; the script exits 2 elsewhere, so the linux job does not run it.
      - run: bash scripts/no-network-test.sh
      - name: Check the claims the docs make
        run: bash scripts/check-claims.sh

      # The public tracker is a product surface. This reads every issue, every
      # comment, and every prior version GitHub still serves, and fails when
      # one reads as a working session rather than a defect report. It runs
      # its own self-test first and refuses to judge if a rule has gone dead.
      - name: The public issues read like bug reports
        run: python3 scripts/check-issues.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # check-claims.sh proves the page and demo/transcripts.json agree with
      # each other. Two equally stale copies agree with each other too. This
      # runs the binaries again and diffs what they print against what is
      # committed, which is the claim the site actually makes.
      - name: Do the committed transcripts still come out of these binaries
        run: bash scripts/check-transcripts-reproduce.sh

      # The refusal demo's evidence chain. Clones a pinned public fixture,
      # builds v0.4.0 and v0.5.0 from their tags, and asserts every number the
      # demo states -- 356 files proposed, 105 of them res://-referenced, the
      # new binary refusing with exit 2. A demo whose facts stop being
      # measurable is a demo that must not be shown.
      - name: The refusal demo still tells the truth
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          EVIDENCE_DIR="$RUNNER_TEMP/evidence" bash demo/refusal/run.sh

      # Retained so a reader can check the claim without rebuilding two tagged
      # binaries and cloning a 70 MB fixture. The job is the evidence; this is
      # the part of it someone can download in a few seconds.
      - name: Keep the demo's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refusal-demo-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

  deny:
    name: dependency policy (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Installs the cargo-deny binary rather than building it from source, so
      # this job stays fast; it does not add anything to the workspace's own
      # dependency graph.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # deny.toml configures all four sections and all four currently
          # pass; run them all so a newly-introduced problem in any of them
          # fails CI instead of being silently uncovered.
          command: check bans licenses sources advisories

  stress:
    name: adversarial stress suite (ratchet)
    runs-on: macos-latest
    # ALWAYS runs, and decides inside whether there is anything to attack.
    #
    # It used to be gated with `if:` to schedule and manual dispatch, because
    # the suite builds 50k-file trees and real disk images and takes minutes.
    # That made it impossible to require as a status check: GitHub leaves a
    # required check that never reports PENDING FOREVER, so requiring a
    # conditional job deadlocks every pull request. Required and conditional
    # do not compose.
    #
    # The consequence was not theoretical. A pull request whose entire purpose
    # was a red ratchet showed all-green on its own page throughout, because
    # the job that would have caught the bug never ran against it. The rule
    # "dispatch it by hand" existed and was forgotten within a day.
    #
    # So the job always reports, and skips the expensive part when the diff
    # cannot affect it. The skip is announced in the log rather than silent:
    # a green check that quietly checked nothing is the failure this repo
    # keeps finding in itself.
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so a pull request can be diffed against its base.
          fetch-depth: 0

      - name: Decide whether the suite can be affected by this change
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # Schedule and manual dispatch always run the full suite: they exist
          # to catch what a diff-based rule cannot, like a flake that depends
          # on timing rather than on code.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "reason=event is ${{ github.event_name }}, not a pull request" >> "$GITHUB_OUTPUT"
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "files changed:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Conservative on purpose. Anything that could reach the binaries or
          # the harness runs the suite; only files that provably cannot are
          # skipped. A wrong answer here is a green check that checked
          # nothing, so the list of things it skips is short and explicit
          # rather than a list of things it catches.
          # `command grep`, not `grep`: a shell that wraps grep with something
          # else can change what -qv means. Verified under bash, which is what
          # `run:` uses.
          if printf '%s\n' "$changed" | command grep -qvE '^(README\.md|CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|LICENSE|\.gitignore)'; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "reason=the diff touches something outside documentation" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "reason=every changed path is documentation" >> "$GITHUB_OUTPUT"
          fi

      - name: Say what was decided
        run: |
          echo "run the suite: ${{ steps.scope.outputs.run }}"
          echo "because: ${{ steps.scope.outputs.reason }}"
          if [ "${{ steps.scope.outputs.run }}" = "no" ]; then
            echo ""
            echo "The adversarial suite did NOT run against this change."
            echo "This check is green because nothing in the diff can reach the"
            echo "tools or the harness, not because the suite passed."
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'yes'
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'yes'
      - name: Run the stress suite against the recorded baseline
        if: steps.scope.outputs.run == 'yes'
        env:
          # Somewhere the upload step can reach. The default is the runner's
          # temp dir, which is destroyed with the runner.
          ETUDES_EVIDENCE_DIR: ${{ github.workspace }}/stress-evidence
        run: bash scripts/stress-ratchet.sh

      # if: always() because the evidence only exists when the suite FAILED.
      # Running this only on success would upload nothing, every time.
      # Only 30-sigkill-mid-apply writes evidence today, so this uploads
      # nothing for any other scenario's failure. Named for what it does
      # rather than for what it looks like it does.
      - name: Keep the evidence from a failing sigkill trial
        if: always() && steps.scope.outputs.run == 'yes' 
        uses: actions/upload-artifact@v4
        with:
          name: stress-evidence
          path: stress-evidence/
          if-no-files-found: ignore
          retention-days: 30
